apiVersion: apps/v1
kind: Deployment

metadata:
  name: secure-app
  namespace: secure-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: secure-app

  template:
    metadata:
      labels:
        app: secure-app

    spec:
      serviceAccountName: secure-app-sa

      containers:
      - name: secure-app

        image: srikantheggoju/enterprise-app:2

        ports:
        - containerPort: 5000

        env:
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: username

        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: password
